[workspace]
resolver = "2"
members = [
    "llcraft-error",
    "llcraft-vm",
    "llcraft-agent",
    "llcraft-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
llcraft-error = { path = "llcraft-error" }
llcraft-vm = { path = "llcraft-vm" }
llcraft-agent = { path = "llcraft-agent" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# Futures
futures-core = "0.3"
futures-util = "0.3"
futures-task = "0.3"
async-stream = "0.3"

# Error handling
anyhow = "1.0"
strum = { version = "0.26", features = ["derive"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Dev/test
tempfile = "3.24.0"
tokio-test = "0.4"
